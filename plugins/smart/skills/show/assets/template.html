<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfbfd;
    --fg:#1a1d24; --muted:#5a6170; --line:#e4e7ec;
    --accent:#3358d4; --accent-soft:#eaefff;
    --good:#0f9960; --good-soft:#e6f7ef;
    --bad:#d1393e;  --bad-soft:#fdeceb;
    --warn:#b76e00; --warn-soft:#fff4e0;
    --code-bg:#0f1117; --code-fg:#dbe2f0;
    --shadow:0 1px 2px rgba(20,22,30,.04), 0 8px 24px rgba(20,22,30,.05);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161c; --panel:#1b1e26; --panel-2:#20232c;
      --fg:#e9ebf1; --muted:#9aa1b2; --line:#2c303c;
      --accent:#7c96ff; --accent-soft:#232a4a;
      --good:#3ddc97; --good-soft:#173328;
      --bad:#ff6b6b;  --bad-soft:#3a1f20;
      --warn:#ffb454; --warn-soft:#3a2c12;
      --code-bg:#0b0d12; --code-fg:#d7deee;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);line-height:1.65;
    font:14.5px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Hiragino Sans GB","Noto Sans CJK SC",sans-serif}
  .layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;
    max-width:1280px;margin:0 auto;padding:28px 24px 80px}

  /* ---- TOC sidebar (card) ---- */
  nav.toc{position:sticky;top:24px;align-self:start;max-height:calc(100vh - 48px);overflow-y:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 16px;box-shadow:var(--shadow)}
  nav.toc .brand{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:0 0 10px 4px}
  nav.toc a{display:block;padding:6px 8px;border-radius:8px;color:var(--muted);
    text-decoration:none;font-size:13.5px;margin-bottom:2px}
  nav.toc a:hover{background:var(--accent-soft);color:var(--accent)}
  nav.toc a.l2{padding-left:20px;font-size:13px}

  main{min-width:0}

  /* ---- hero header (card) ---- */
  header.hero{background:linear-gradient(135deg,var(--accent-soft),var(--panel));
    border:1px solid var(--line);border-radius:var(--radius);
    padding:30px 32px 24px;margin-bottom:22px;box-shadow:var(--shadow)}
  header.hero h1{font-size:27px;margin:0 0 8px;letter-spacing:-.01em;line-height:1.3}
  header.hero p.sub{margin:0;color:var(--muted);font-size:15px;max-width:70ch}

  /* ---- sections are white cards on the gray page ---- */
  section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 28px;margin-bottom:20px;box-shadow:var(--shadow);scroll-margin-top:20px}
  section h2{font-size:19px;margin:0 0 16px;display:flex;align-items:center;gap:10px}
  section h2 .num{display:inline-flex;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:8px;background:var(--accent-soft);
    color:var(--accent);font-size:13px;font-weight:700;flex:none}
  section h3{font-size:15.5px;margin:22px 0 10px}
  section h3:first-of-type{margin-top:4px}
  p{margin:0 0 12px}
  a{color:var(--accent)}
  .dim{color:var(--muted)}

  /* ---- stat tiles ---- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:4px 0 8px}
  .tile{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .tile .v{font-size:22px;font-weight:700;line-height:1.2}
  .tile .v.good{color:var(--good)} .tile .v.bad{color:var(--bad)} .tile .v.accent{color:var(--accent)}
  .tile .k{font-size:12.5px;color:var(--muted);margin-top:4px}

  /* ---- badges ---- */
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700}
  .badge.high{background:var(--bad-soft);color:var(--bad)}
  .badge.med{background:var(--warn-soft);color:var(--warn)}
  .badge.low{background:var(--good-soft);color:var(--good)}

  /* ---- callouts ---- */
  .callout{border:1px solid var(--accent);background:var(--accent-soft);
    border-radius:10px;padding:12px 16px;margin:12px 0;font-size:14px}
  .callout b{color:var(--accent)}
  .callout.warn{border-color:var(--warn);background:var(--warn-soft)}
  .callout.warn b{color:var(--warn)}
  .callout.risk{border-color:var(--bad);background:var(--bad-soft)}
  .callout.risk b{color:var(--bad)}
  .callout.ok{border-color:var(--good);background:var(--good-soft)}
  .callout.ok b{color:var(--good)}

  /* ---- two-panel comparison (e.g. goals vs non-goals) ---- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0}
  .panel{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--panel-2)}
  .panel.good{background:var(--good-soft);border-color:var(--good)}
  .panel.warn{background:var(--warn-soft);border-color:var(--warn)}
  .panel>.hd{font-weight:700;margin-bottom:10px;font-size:13.5px;display:flex;align-items:center;gap:6px}
  .panel ul{margin:0;padding-left:20px}
  .panel li{margin-bottom:6px;font-size:14px}

  /* ---- option cards: N alternatives, chosen one highlighted ---- */
  .options{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin:6px 0}
  .opt{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--panel-2);position:relative}
  .opt.chosen{border-color:var(--good);background:var(--good-soft);box-shadow:0 0 0 1px var(--good)}
  .opt .tag{position:absolute;top:-11px;right:14px;background:var(--good);color:#fff;
    font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px}
  .opt h4{margin:0 0 10px;font-size:14.5px}
  .pro,.con{font-size:13px;margin-bottom:6px;padding-left:18px;position:relative}
  .pro::before{content:"+";position:absolute;left:0;color:var(--good);font-weight:800}
  .con::before{content:"\2013";position:absolute;left:0;color:var(--bad);font-weight:800}

  /* ---- collapsible ---- */
  details{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:0 14px;background:var(--panel-2)}
  details summary{cursor:pointer;font-weight:600;padding:10px 0;list-style-position:inside}
  details[open] summary{border-bottom:1px solid var(--line);margin-bottom:8px}

  /* ---- code (dark block in both themes) ---- */
  pre{background:var(--code-bg);color:var(--code-fg);border-radius:12px;
    padding:14px 16px;overflow-x:auto;font-size:12.8px;line-height:1.6}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.94em}
  :not(pre)>code{background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
    padding:1px 5px;color:var(--fg)}

  /* ---- tables ---- */
  .tablewrap{overflow-x:auto;margin:6px 0 4px}
  table{border-collapse:collapse;width:100%;font-size:13.8px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;
    letter-spacing:.03em;background:var(--panel-2)}
  tr:last-child td{border-bottom:none}

  /* ---- acceptance checklist ---- */
  ul.check{list-style:none;padding-left:2px;margin:6px 0}
  ul.check li{padding-left:26px;position:relative;margin:8px 0;font-size:14px}
  ul.check li::before{content:"\2610";position:absolute;left:0;color:var(--muted)}
  ul.check li.done::before{content:"\2611";color:var(--good)}

  /* ---- inline SVG diagrams ---- */
  figure{margin:14px 0;text-align:center}
  figure svg{max-width:100%;height:auto}
  figcaption{font-size:12.5px;color:var(--muted);margin-top:8px}

  /* ---- provenance footer ---- */
  footer.meta{margin-top:36px;padding:14px 4px 0;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted)}
  footer.meta code{font-size:12px}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;gap:20px;padding:20px 14px 48px}
    nav.toc{position:static;max-height:none}
    .grid2{grid-template-columns:1fr}
  }
  @media print{
    nav.toc{display:none}
    .layout{grid-template-columns:1fr}
    section{box-shadow:none;page-break-inside:avoid}
    details{page-break-inside:avoid}
  }
</style>
</head>
<body>
<div class="layout">
  <nav class="toc">
    <div class="brand">{{TITLE_SHORT}}</div>
    {{TOC}}
  </nav>
  <main>
    <header class="hero">
      <h1>{{TITLE}}</h1>
      <p class="sub">{{SUBTITLE}}</p>
    </header>
    {{CONTENT}}
    <footer class="meta">
      Generated {{GENERATED_AT}} · source: {{SOURCE}} · commit <code>{{COMMIT}}</code>
      · by /smart:show — derived review page; regenerate instead of editing.
    </footer>
  </main>
</div>
</body>
</html>
